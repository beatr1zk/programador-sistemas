<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro formulário GET</title>
</head>

<body>
    <form method="get" action="/recebe/">
        <label>Nome:</label>
        <input type="text" name="nome"  placeholder="Digite o seu nome">
        <label>Idade:</label>
        <input type="number" name="idade" placeholder="Digite sua idade ex: 18">
        <label>Cidade:</label>
        <input type="text" name="cidade" placeholder="Digite a sua cidade">
        <label>Email:</label>
        <input type="email" name="email" placeholder="Digite o seu email ex: exemplo@xxxx.xxx">
        <button type="submit">Enviar</button>>
    </form>
</body>
</html>
